<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnWorking</title>
  <style>
    /* 强制滚动条常显(Windows 覆盖式滚动条默认会隐藏,表格拉宽后看不到横向条) */
    *::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    *::-webkit-scrollbar-track {
      background: #f0f0f0;
    }
    *::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border-radius: 6px;
      border: 2px solid #f0f0f0;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: #a0a0a0;
    }
    *::-webkit-scrollbar-corner {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
